<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuboq – ruttplanering på riktigt</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Montserrat rubrikfont (lätt & snygg) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#0f43e1;   /* Nuboq blå */
      --bg2:#0a2e9f;
      --text:#ffffff;
      --muted:rgba(255,255,255,.88);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      /* dot-grid + gradient */
      background:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,.09) 1px, transparent 1px) 0 0/18px 18px,
        linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      overflow:hidden;
    }

    .wrap{
      width:min(960px, 92vw);
      text-align:left;
      line-height:1.3;
      position:relative;
      isolation:isolate;
    }

    /* Glow bakom loggan */
    .glow{
      position:absolute; inset: -120px -160px auto auto;
      width:520px; height:520px;
      background: radial-gradient(45% 45% at 40% 40%, rgba(255,255,255,.22), transparent 70%);
      filter: blur(30px);
      opacity:.55;
      z-index:-1;
      pointer-events:none;
      animation: floatGlow 9s ease-in-out infinite alternate;
    }
    @keyframes floatGlow{
      from{ transform: translate(0,0) scale(1); opacity:.55; }
      to  { transform: translate(10px,-8px) scale(1.03); opacity:.7; }
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:14px;
      opacity:0; transform: translateY(12px) scale(.98);
      animation: fadeUp .9s ease-out .2s forwards;
    }
    .logo{
      width:92px; aspect-ratio:1/1; flex:0 0 92px;
      display:grid; place-items:center;
      border-radius:50%;
      background:rgba(255,255,255,.08);
      border:2px solid rgba(255,255,255,.28);
      box-shadow: 0 0 32px rgba(20, 90, 255, .35), inset 0 0 20px rgba(255,255,255,.06);
      backdrop-filter: blur(2px);
    }
    .title{
      margin:0;
      font-family:"Montserrat", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight:800;
      font-size:clamp(38px, 6vw, 64px);
      letter-spacing:.6px;
    }

    .tag{
      margin:10px 0 0 4px;
      font-size:clamp(18px, 2.2vw, 22px);
      color:var(--muted);
      opacity:0; transform: translateY(10px);
      animation: fadeUp .9s ease-out .5s forwards;
    }

    @keyframes fadeUp{
      from{opacity:0; transform: translateY(12px) scale(.98)}
      to  {opacity:1; transform: translateY(0)    scale(1)}
    }

    footer{
      position:fixed; inset:auto 16px 16px 16px;
      text-align:center; font-size:12px; color:rgba(255,255,255,.6);
    }

    /* Responsiv centrering – allt ser bra ut även på mobil */
    .stack{max-width:760px}
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-label="NUBOQ kommer snart">
    <div class="glow" aria-hidden="true"></div>

    <div class="stack">
      <div class="brand">
        <!-- Byt gärna till en vektor (logo.svg) om du har – <img src="logo.svg" ...> -->
        <div class="logo" aria-hidden="true">
          <img src="NUBOQ_logo_with_text_transparent.png" alt="NUBOQ" style="width:72px;height:auto;display:block;filter:brightness(1.05) contrast(1.05)" />
        </div>
        <h1 class="title">NUBOQ</h1>
      </div>

      <p class="tag">Snart är vi igång med nya spännande saker…</p>
    </div>
  </main>

  <footer>© <span id="y"></span> NUBOQ. Alla rättigheter förbehållna.</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
