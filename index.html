<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuboq - Ruttplanering på riktigt</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root{
      --bg1:#0b1535;
      --bg2:#0d2c67;
      --bg3:#0b3e9b;
      --glass: rgba(255,255,255,.08);
      --glass-border: rgba(255,255,255,.18);
      --shadow: rgba(0,0,0,.45);
      --accent:#8ab4ff;
      --accent-strong:#5ca0ff;
      --success:#2ecc71;
      --error:#ff6b6b;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0;
      color:#fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow-x:hidden;
      background: linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 200% 200%;
      animation: bgMove 16s ease-in-out infinite;
      position:relative;
    }
    @keyframes bgMove{
      0%  { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100%{ background-position: 0% 50% }
    }

    /* Vignette + diskret sweep-light för mer tech-känsla */
    body::before, body::after{
      content:"";
      position:absolute; inset:0; pointer-events:none;
    }
    body::before{
      background: radial-gradient(60% 60% at 50% 30%, rgba(255,255,255,.10) 0%, transparent 60%),
                  radial-gradient(90% 90% at 50% 120%, rgba(0,0,0,.45) 0%, transparent 60%);
      mix-blend-mode: screen;
    }
    body::after{
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.10) 50%, transparent 65%);
      transform: translateX(-100%);
      animation: sweep 12s ease-in-out infinite;
    }
    @keyframes sweep{
      0%,20%   { transform: translateX(-110%) }
      60%      { transform: translateX(110%) }
      100%     { transform: translateX(110%) }
    }

    /* Glow bakom loggan */
    .glow{
      position:absolute;
      width:min(70vw,720px);
      height:min(70vw,720px);
      top:20%; left:50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(138,180,255,.22) 0%, transparent 60%);
      filter: blur(2px);
      animation: pulse 10s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes pulse{
      0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(1) }
      50%    { opacity:.35; transform:translate(-50%,-50%) scale(1.08) }
    }

    img.logo{
      width:min(520px, 80vw);
      margin:0 0 14px;
      filter: drop-shadow(0 18px 34px var(--shadow));
      z-index:1;
      animation: float 9s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{ transform: translateY(0) }
      50%    { transform: translateY(-7px) }
    }

    p.tagline{
      margin:0 0 22px;
      font-size:1.15rem;
      font-weight:300;
      opacity:.95;
      z-index:1;
    }

    .cta{
      z-index:1;
      background: linear-gradient(180deg, #ffffff, #eaf2ff);
      color:#0b2e7a;
      border:none;
      border-radius:14px;
      padding:14px 22px;
      font-weight:800;
      letter-spacing:.2px;
      box-shadow: 0 14px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.35) inset;
      cursor:pointer;
      transition: .2s transform, .2s box-shadow, .2s opacity, .2s background;
    }
    .cta:hover{ transform: translateY(-1px); box-shadow: 0 18px 34px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.45) inset }
    .cta:active{ transform: translateY(0) }

    /* Collapsible container för formuläret */
    .collapse{
      width:min(92vw, 720px);
      margin-top:14px;
      max-height:0;
      overflow:hidden;
      transition: max-height .5s ease, opacity .35s ease, transform .35s ease;
      opacity:0; transform: translateY(-4px);
    }
    .collapse.show{ max-height:240px; opacity:1; transform:none }

    .card{
      background: var(--glass);
      border:1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius:16px;
      padding:16px;
      box-shadow: 0 16px 32px var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }
    .card h3{
      margin:2px 0 2px;
      font-size:1rem;
      font-weight:700;
      opacity:.95;
    }
    .row{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .sr-only{
      position:absolute !important;
      width:1px;height:1px; padding:0;margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;border:0;
    }
    input[type="email"]{
      flex:1 1 360px;
      min-width:260px;
      padding:14px 16px;
      border-radius:12px;
      border:1px solid var(--glass-border);
      background: rgba(255,255,255,.12);
      color:#fff;
      outline:none;
      font-size:1rem;
      transition: .2s border-color, .2s background, .2s box-shadow;
      box-shadow: inset 0 0 0 9999px rgba(255,255,255,.02);
    }
    input[type="email"]::placeholder{ color: rgba(255,255,255,.7); }
    input[type="email"]:focus{
      border-color: var(--accent);
      background: rgba(255,255,255,.18);
      box-shadow: 0 0 0 3px rgba(138,180,255,.25);
    }
    button.submit{
      padding:14px 18px;
      border-radius:12px;
      border: none;
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      color:#0a1a3d;
      font-weight:800;
      cursor:pointer;
      min-width:160px;
      transition: .2s transform, .2s box-shadow, .2s opacity;
      box-shadow: 0 12px 22px rgba(0,0,0,.25);
    }
    button.submit:hover{ transform: translateY(-1px) }
    button.submit:disabled{ opacity:.65; cursor:wait; transform:none }

    .msg{
      font-size:.95rem; font-weight:700; margin-top:2px;
    }
    .msg.success{ color: var(--success) }
    .msg.error  { color: var(--error)  }

    footer{
      position:absolute; bottom:16px; width:100%;
      text-align:center; font-size:.8rem; opacity:.85; z-index:1; pointer-events:none;
    }

    @media (max-width: 460px){
      .cta{ width:calc(100vw - 32px) }
      .card{ padding:14px }
      button.submit{ width:100% }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <img src="NUBOQ_logo_with_text_transparent.png" alt="Nuboq" class="logo" />
  <p class="tagline">Den som väntar på något gott...</p>

  <!-- Primär CTA -->
  <button id="openSignup" class="cta" aria-expanded="false" aria-controls="signupWrap">
    Bli meddelad när vi går live
  </button>

  <!-- Kollapsbart formulär -->
  <div id="signupWrap" class="collapse" aria-hidden="true">
    <form id="notifyForm" class="card" aria-label="Notifiering vid lansering">
      <h3>Vill du ha en notis när vi lanserar? Lämna din e-post.</h3>
      <div class="row">
        <label for="email" class="sr-only">E-postadress</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="din@email.se" required />
        <button id="submitBtn" class="submit" type="submit">Få notiser</button>
      </div>
      <div id="formMsg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <footer>© 2025 NUBOQ. Alla rättigheter förbehållna.</footer>

  <script>
    // ——— Konfiguration ———
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/xanpelda"; // behåll ditt ID

    // ——— Collapsible logic ———
    const openBtn = document.getElementById('openSignup');
    const wrap    = document.getElementById('signupWrap');
    openBtn.addEventListener('click', () => {
      const open = wrap.classList.toggle('show');
      wrap.setAttribute('aria-hidden', String(!open));
      openBtn.setAttribute('aria-expanded', String(open));
      if (open) setTimeout(() => document.getElementById('email').focus(), 180);
    });

    // ——— Form logic ———
    const form   = document.getElementById('notifyForm');
    const email  = document.getElementById('email');
    const btn    = document.getElementById('submitBtn');
    const msgBox = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.textContent = "";
      msgBox.className = "msg";

      if (!email.checkValidity()) {
        msgBox.textContent = "Ange en giltig e-postadress.";
        msgBox.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Skickar…";

      try{
        const res = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form)
        });

        if(res.ok){
          msgBox.textContent = "Tack! Vi pingar dig när vi går live.";
          msgBox.classList.add('success');
          
          // Track email signup event
          if (window.NuboqAnalytics) {
            window.NuboqAnalytics.trackCustomEvent('email_signup', {
              source: 'landing_page',
              form_type: 'notify_form'
            });
          }
          
          form.reset();
        }else{
          const data = await res.json().catch(()=> ({}));
          msgBox.textContent = (data?.error || "Något gick fel. Försök igen.");
          msgBox.classList.add('error');
        }
      }catch{
        msgBox.textContent = "Kunde inte skicka just nu. Kontrollera uppkoppling och försök igen.";
        msgBox.classList.add('error');
      }finally{
        btn.disabled = false;
        btn.textContent = "Få notiser";
      }
    });
  </script>
  
  <!-- Analytics Tracker - Lägg till här före </body> -->
  <script src="https://api.nuboq.com/analytics-tracker.js"></script>
  <!-- Alternativt om filen ligger lokalt: <script src="/analytics-tracker.js"></script> -->
</body>
</html>
