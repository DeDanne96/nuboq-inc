<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuboq - ruttplanering på riktigt</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root{
      --blue1:#0a3d91;
      --blue2:#0f62fe;
      --blue3:#2980b9;
      --glass: rgba(255,255,255,.08);
      --glass-border: rgba(255,255,255,.18);
      --shadow: rgba(0,0,0,.35);
      --accent:#7ec8ff;
      --success:#2ecc71;
      --error:#ff6b6b;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:#fff;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      overflow:hidden;
      /* animerad diagonal gradient */
      background: linear-gradient(135deg, var(--blue1), var(--blue2), var(--blue3));
      background-size: 200% 200%;
      animation: bgMove 14s ease-in-out infinite;
      position:relative;
    }
    @keyframes bgMove{
      0%{ background-position: 0% 50%; }
      50%{ background-position: 100% 50%; }
      100%{ background-position: 0% 50%; }
    }

    /* mjuk pulserande glow bakom loggan */
    .glow{
      position:absolute;
      width:680px; height:680px;
      top:22%; left:50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,255,255,.14) 0%, transparent 65%);
      filter: blur(2px);
      pointer-events:none;
      animation: pulse 8s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(1);}
      50%    {opacity:.35; transform:translate(-50%,-50%) scale(1.07);}
    }

    img.logo{
      width:min(420px, 75vw);
      margin: 0 0 16px 0;
      filter: drop-shadow(0 18px 28px var(--shadow));
      z-index:1;
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{ transform: translateY(0); }
      50%    { transform: translateY(-6px); }
    }

    p.tagline{
      font-size:1.2rem;
      font-weight:300;
      margin:0 0 26px 0;
      z-index:1;
      opacity:.95;
    }

    /* glassy card för formuläret */
    .card{
      z-index:1;
      background: var(--glass);
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 28px var(--shadow);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      max-width: 680px;
      width: min(92vw, 680px);
    }
    .card h3{
      font-size:1rem;
      font-weight:600;
      margin:0 0 6px 0;
      width:100%;
      opacity:.95;
    }
    .input{
      flex:1 1 320px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
    }
    input[type="email"]{
      width:100%;
      padding:14px 16px;
      border-radius:10px;
      border:1px solid var(--glass-border);
      background: rgba(255,255,255,.12);
      color:#fff;
      outline:none;
      font-size:1rem;
      transition: .2s border-color, .2s background;
    }
    input[type="email"]::placeholder{ color: rgba(255,255,255,.7); }
    input[type="email"]:focus{
      border-color: var(--accent);
      background: rgba(255,255,255,.18);
    }
    button{
      padding:14px 18px;
      border-radius:10px;
      border: none;
      background:#ffffff;
      color:#0b3a91;
      font-weight:700;
      cursor:pointer;
      transition: .2s transform, .2s box-shadow, .2s opacity;
      box-shadow: 0 10px 18px rgba(0,0,0,.2);
      min-width:160px;
    }
    button:hover{ transform: translateY(-1px); }
    button:disabled{
      opacity:.65;
      cursor:wait;
      transform:none;
    }

    .msg{
      width:100%;
      margin-top:8px;
      font-size:.95rem;
      font-weight:600;
    }
    .msg.success{ color: var(--success); }
    .msg.error  { color: var(--error); }

    footer{
      position:absolute;
      bottom:16px;
      font-size:.8rem;
      opacity:.85;
      z-index:1;
      width:100%;
      text-align:center;
      pointer-events:none;
    }

    @media (max-width: 420px){
      .card{ padding:12px; }
      button{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <img src="NUBOQ_logo_with_text_transparent.png" alt="Nuboq Logo" class="logo" />
  <p class="tagline">Den som väntar på något gott...</p>

  <!-- Signup-kortet -->
  <form id="notifyForm" class="card" aria-label="Notifiering vid lansering">
    <h3>Vill du ha en notis när vi lanserar? Lämna din e-post.</h3>
    <div class="input">
      <label for="email" class="sr-only">E-postadress</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="din@email.se" required />
      <button id="submitBtn" type="submit">Få notiser</button>
    </div>
    <div id="formMsg" class="msg" role="status" aria-live="polite"></div>
  </form>

  <footer>© 2025 NUBOQ. Alla rättigheter förbehållna.</footer>

  <script>
    // Byt ut med ditt Formspree-ID
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/xanpelda";

    const form   = document.getElementById('notifyForm');
    const email  = document.getElementById('email');
    const btn    = document.getElementById('submitBtn');
    const msgBox = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.textContent = "";
      msgBox.className = "msg";
      if(!email.checkValidity()){
        msgBox.textContent = "Ange en giltig e-postadress.";
        msgBox.classList.add('error');
        return;
      }
      btn.disabled = true;
      btn.textContent = "Skickar…";

      try{
        const res = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form)
        });

        if(res.ok){
          msgBox.textContent = "Tack! Vi pingar dig när vi går live.";
          msgBox.classList.add('success');
          form.reset();
        }else{
          const data = await res.json().catch(()=> ({}));
          msgBox.textContent = (data?.error || "Något gick fel. Prova igen strax.");
          msgBox.classList.add('error');
        }
      }catch(err){
        msgBox.textContent = "Kunde inte skicka just nu. Kolla uppkoppling och försök igen.";
        msgBox.classList.add('error');
      }finally{
        btn.disabled = false;
        btn.textContent = "Få notiser";
      }
    });
  </script>
</body>
</html>
